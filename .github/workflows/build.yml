name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "integrate/**"]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: xcodebuild build -project Spectty.xcodeproj -scheme Spectty -destination 'generic/platform=iOS Simulator' -quiet

      - name: Terminal tests
        run: swift test --package-path Packages/SpecttyTerminal

      - name: UI package tests
        working-directory: Packages/SpecttyUI
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild test -scheme SpecttyUI -destination "platform=iOS Simulator,id=$simulator_id" -parallel-testing-enabled NO -quiet
